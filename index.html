<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Saint-Valentin 💘</title>
  <style>
    :root{
      --pink1:#ff4d6d;
      --pink2:#ff9a9e;
      --pink3:#ffd1dc;
      --card: rgba(255,255,255,.88);
      --shadow: 0 25px 80px rgba(0,0,0,.18);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow:hidden;
      background:
        radial-gradient(1200px 700px at 20% 10%, #fff 0%, rgba(255,255,255,.2) 30%, transparent 60%),
        radial-gradient(900px 600px at 90% 20%, rgba(255,255,255,.35) 0%, transparent 60%),
        linear-gradient(135deg, var(--pink1), var(--pink2), var(--pink3));
      background-size: 200% 200%;
      animation: bgMove 10s ease-in-out infinite;
      padding: 24px;
    }
    @keyframes bgMove{
      0%{ background-position: 0% 50%; }
      50%{ background-position: 100% 50%; }
      100%{ background-position: 0% 50%; }
    }

    .sparkles{
      position:fixed; inset:0;
      pointer-events:none;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,.6) 0 2px, transparent 3px),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,.45) 0 2px, transparent 3px),
        radial-gradient(circle at 75% 35%, rgba(255,255,255,.5) 0 2px, transparent 3px),
        radial-gradient(circle at 85% 85%, rgba(255,255,255,.35) 0 2px, transparent 3px);
      opacity:.35;
      animation: twinkle 3.5s ease-in-out infinite;
    }
    @keyframes twinkle{ 0%,100%{opacity:.22} 50%{opacity:.42} }

    .float-hearts{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }
    .fh{
      position:absolute; bottom:-60px;
      font-size: 22px; opacity:.35;
      animation: rise linear infinite;
    }
    @keyframes rise{
      from { transform: translateY(0) translateX(0) rotate(0deg); }
      to   { transform: translateY(-120vh) translateX(40px) rotate(20deg); }
    }

    .card{
      width:min(760px, 100%);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 28px;
      padding: 30px 22px 22px;
      box-shadow: var(--shadow);
      text-align:center;
      position: relative;
      backdrop-filter: blur(8px);
      overflow:hidden;
    }

    .badge{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.65);
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 10px;
    }

    h1{
      margin: 0 0 8px;
      font-size: clamp(22px, 3.3vw, 36px);
      line-height: 1.15;
      color:#111;
    }
    .sub{
      margin: 0 0 16px;
      color:#333;
      font-size: 16px;
    }
    .heartBig{
      display:inline-block;
      animation: pulse 1.25s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{ transform: scale(1); }
      50%{ transform: scale(1.12); }
    }

    .buttons{
      position: relative;
      height: 155px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 18px;
      margin-top: 8px;
    }

    button{
      border:0;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
      box-shadow: 0 14px 35px rgba(0,0,0,.16);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    #yes{
      background: linear-gradient(180deg, #22c55e, #16a34a);
      color:#fff;
    }
    #yes:hover{ transform: translateY(-1px) scale(1.02); filter: brightness(1.02); }
    #yes:active{ transform: translateY(0px) scale(.99); }

    #no{
      background: linear-gradient(180deg, #fb7185, #ef4444);
      color:#fff;
      position:absolute;
      left: 62%;
      top: 55%;
      transform: translate(-50%,-50%);
      touch-action:none;
    }

    .result{
      margin-top: 16px;
      font-size: 18px;
      font-weight: 900;
      min-height: 28px;
      color:#111;
    }
    .small{
      margin-top: 6px;
      font-size: 13px;
      color:#444;
      opacity:.85;
      min-height: 18px;
    }

    .pop{
      position:fixed;
      left:0; top:0;
      width: 12px; height: 12px;
      pointer-events:none;
      transform: translate(-50%,-50%);
      will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div class="sparkles"></div>
  <div class="float-hearts" id="floatHearts"></div>

  <div class="card">
    <div class="badge">💌 Message spécial</div>

    <h1>
      Voudriez-vous Clémence être ma Valentine ?
      <span class="heartBig">💘</span>
    </h1>
    <p class="sub">Choisissez avec sagesse 😄</p>

    <div class="buttons" id="arena">
      <button id="yes">Oui</button>
      <button id="no" aria-label="Non">Non</button>
    </div>

    <div class="result" id="result"></div>
    <div class="small" id="small"></div>
  </div>

  <script>
    // ====== CONFIG WHATSAPP (A MODIFIER) ======
    // Mets ton numéro au format international sans + ni espaces. (Togo = 228)
    const WHATSAPP_PHONE = "33751194407"; // ex: "22890123456"

    // Message envoyé quand elle clique "Oui"
    function buildWhatsAppMessage() {
      const now = new Date();
      const when = now.toLocaleString("fr-FR");
      return `Oui 😍 J'accepte d’être ta Valentine 💘\n\n(Envoyé le ${when})`;
    }
    // =========================================

    const arena = document.getElementById('arena');
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const result = document.getElementById('result');
    const small = document.getElementById('small');

    // Cœurs flottants en fond
    const floatWrap = document.getElementById('floatHearts');
    const heartChars = ["💗","💖","💞","💘","❤️","💕"];
    function spawnFloatHeart(){
      const h = document.createElement('div');
      h.className = 'fh';
      h.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
      const size = 16 + Math.random()*22;
      h.style.fontSize = size + 'px';
      h.style.left = (Math.random()*100) + 'vw';
      h.style.opacity = (0.18 + Math.random()*0.35).toFixed(2);
      const dur = 8 + Math.random()*10;
      h.style.animationDuration = dur + 's';
      h.style.animationDelay = (-Math.random()*dur) + 's';
      floatWrap.appendChild(h);
      if(floatWrap.children.length > 36) floatWrap.removeChild(floatWrap.firstChild);
    }
    for(let i=0;i<26;i++) spawnFloatHeart();
    setInterval(spawnFloatHeart, 550);

    // Bouton NON qui fuit
    function moveNoButton(){
      const a = arena.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const pad = 10;
      const maxX = a.width - b.width - pad*2;
      const maxY = a.height - b.height - pad*2;

      const x = pad + Math.random() * Math.max(0, maxX);
      const y = pad + Math.random() * Math.max(0, maxY);

      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.transform = 'translate(0,0)';
    }
    let dodgeTimer = setInterval(moveNoButton, 380);

    arena.addEventListener('mousemove', (e) => {
      const b = noBtn.getBoundingClientRect();
      const dx = e.clientX - (b.left + b.width/2);
      const dy = e.clientY - (b.top + b.height/2);
      const dist = Math.hypot(dx, dy);
      if(dist < 140) moveNoButton();
    });
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    }, { passive:false });

    // Confettis cœurs
    function heartPop(x, y, count=32){
      for(let i=0;i<count;i++){
        const el = document.createElement('div');
        el.className = 'pop';
        el.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.fontSize = (14 + Math.random()*18) + 'px';
        document.body.appendChild(el);

        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random()*6;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed - (4 + Math.random()*4);
        const rot = (Math.random()*140 - 70);

        const life = 900 + Math.random()*600;
        const start = performance.now();

        function animate(now){
          const t = now - start;
          const p = Math.min(1, t / life);
          const ease = 1 - Math.pow(1 - p, 3);

          const dx = vx * 60 * ease;
          const dy = vy * 60 * ease + (ease*ease*220);
          el.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot*ease}deg)`;
          el.style.opacity = String(1 - p);

          if(p < 1) requestAnimationFrame(animate);
          else el.remove();
        }
        requestAnimationFrame(animate);
      }
    }

    yesBtn.addEventListener('click', () => {
      const rect = yesBtn.getBoundingClientRect();
      const x = rect.left + rect.width/2;
      const y = rect.top + rect.height/2;

      heartPop(x, y, 40);

      result.textContent = "Yesss 😍";
      small.textContent  = "WhatsApp va s’ouvrir pour envoyer la réponse…";

      // Stoppe le NON (optionnel)
      clearInterval(dodgeTimer);
      noBtn.style.opacity = 0.25;
      noBtn.style.pointerEvents = 'none';

      // Ouvre WhatsApp avec message pré-rempli
      const msg = encodeURIComponent(buildWhatsAppMessage());
      const url = `https://wa.me/${WHATSAPP_PHONE}?text=${msg}`;
      window.location.href = url;
    });

    moveNoButton();
  </script>
</body>
</html>
